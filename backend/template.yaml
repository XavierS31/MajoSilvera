AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Majo Silvera secure PostgreSQL API
Globals:
  Function:
    Timeout: 20
    MemorySize: 512
    Environment:
      Variables:
        DATABASE_URL: !Ref DatabaseUrl
        OAUTH2_CLIENT_ID: !Ref OAuth2ClientId
        OAUTH2_CLIENT_SECRET: !Ref OAuth2ClientSecret
        OAUTH2_TOKEN_INTROSPECT_URL: !Ref OAuth2TokenIntrospectUrl
        GEMINI_API_KEY: !Ref GeminiApiKey
        GEMINI_MODEL: !Ref GeminiModel
        CHATBOT_URL: !Ref ChatbotUrl
        CHATBOT_MAX_TOKENS: !Ref ChatbotMaxTokens
        RATE_LIMIT_WINDOW_MS: !Ref RateLimitWindowMs
        RATE_LIMIT_MAX_REQUESTS: !Ref RateLimitMaxRequests
        CACHE_TTL_SECONDS: !Ref CacheTtlSeconds
        CALENDLY_SCHEDULING_URL: !Ref CalendlySchedulingUrl
        SES_FROM_EMAIL: !Ref SesFromEmail
        SES_TO_EMAIL: !Ref SesToEmail
Parameters:
  DatabaseUrl: { Type: String, NoEcho: true }
  OAuth2ClientId: { Type: String, NoEcho: true }
  OAuth2ClientSecret: { Type: String, NoEcho: true }
  OAuth2TokenIntrospectUrl: { Type: String }
  GeminiApiKey: { Type: String, NoEcho: true }
  GeminiModel: { Type: String, Default: gemini-2.0-flash }
  ChatbotUrl: { Type: String }
  ChatbotMaxTokens: { Type: Number, Default: 300 }
  RateLimitWindowMs: { Type: Number, Default: 60000 }
  RateLimitMaxRequests: { Type: Number, Default: 5 }
  CacheTtlSeconds: { Type: Number, Default: 3600 }
  CalendlySchedulingUrl: { Type: String }
  SesFromEmail: { Type: String }
  SesToEmail: { Type: String }
Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures: [x86_64]
      Policies:
        - Statement:
            Effect: Allow
            Action: [ses:SendEmail, ses:SendRawEmail]
            Resource: '*'
      Events:
        ApiRoute:
          Type: HttpApi
          Properties:
            Path: /api/v1/{proxy+}
            Method: ANY
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: Dockerfile
Outputs:
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/api/v1'
